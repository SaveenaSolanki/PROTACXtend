name: CI

on:
  push:
    branches: [main, release/*]
  pull_request:

jobs:
  # ── FAST GATE: install, compile, asset-free smoke, unit tests ──────
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime dependencies (fast subset)
        run: |
          python -m pip install --upgrade pip
          pip install rdkit pydantic fastapi uvicorn langgraph langchain \
            joblib openpyxl requests pytest pandas numpy

      - name: Compile check
        run: python -m compileall -q synglue_agent scripts

      - name: Asset-free smoke test
        run: python scripts/ci_smoke.py

      - name: Fast unit tests (asset-free subset)
        run: |
          python -m pytest -q \
            synglue_agent/tests/test_heruka_integration.py \
            synglue_agent/tests/test_retrosynthesis.py -m "not slow" \
            synglue_agent/tests/test_rdkit_chemistry.py \
            synglue_agent/tests/test_pareto_ranking.py \
            synglue_agent/tests/test_memory_stores.py \
            synglue_agent/tests/test_mode_router.py \
            synglue_agent/tests/test_unblocked_agents.py -m "not network" \
            synglue_agent/tests/test_binder_live.py -m "not network"

  # ── FULL OFFLINE SUITE: full fast tests + agentic E2E (no LLM) ─────
  full-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    needs: smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # matches numpy==2.4.6 pin (Requires-Python >=3.12)
          cache: pip

      - name: Install full runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-timeout

      - name: Bootstrap upstream repos (needed by repo-wrapper tests)
        run: |
          PROTACPILOT_REPOS="TERNIFY,degradomap,Bellerophon,SE3-protacs,PROTAC-Degradation-Predictor" \
            ./scripts/bootstrap_assets.sh --repos

      - name: Full fast test suite (slow + live-network tests excluded; live
          API tests verified manually, e.g. test_binder_live, patent cross-ref)
        run: |
          python -m pytest synglue_agent/tests/ synglue_agent/agents/test_ternary_stage.py \
            -m "not slow and not network" -q --timeout 300

      - name: End-to-end agentic suite (5 scenarios, real graph, offline LLM)
        run: python scripts/e2e_agentic.py --offline

  # ── SECURITY: secrets in history + artifact availability + lint ────
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gitleaks full-history secret scan
        run: |
          curl -sL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks git --no-banner --redact=100 --exit-code 1

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check synglue_agent/agents/real_nodes.py synglue_agent/run_records.py \
            synglue_agent/tools/admet_integration.py scripts/e2e_agentic.py \
            scripts/ci_smoke.py scripts/run_admet_ai.py --ignore E501

      - name: Artifact / model availability checks (committed assets present)
        run: |
          python - <<'PY'
          from pathlib import Path
          needed = [
              "SynGlue_Py/models/multitask_transformer.pt",   # SynGlue transformer
              "SynGlue_Py/data/grover_e3.csv",
              "SynGlue_Py/data/grover_warhead.csv",
              "SynGlue_Py/data/e3_ligand.csv",
              "data/benchmark/PROTAC-DB_3.0_protacs.xlsx",
              "outputs/benchmark/chemprop_multitarget/model_0/best.pt",
              "ASSET_MANIFEST.md",
              "scripts/bootstrap_assets.sh",
          ]
          missing = [p for p in needed if not Path(p).exists()]
          if missing:
              raise SystemExit(f"MISSING COMMITTED ARTIFACTS: {missing}")
          print("artifact availability: OK (%d checked)" % len(needed))
          PY

      - name: Bootstrap dry-run (external asset URLs live)
        run: ./scripts/bootstrap_assets.sh --dry-run
