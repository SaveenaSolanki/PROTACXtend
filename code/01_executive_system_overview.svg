<text x="160" y="225" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" fill="#10243E" text-anchor="start" >One request activates an end-to-end PROTAC design system</text>
<text x="160" y="285" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="500" fill="#64748B" text-anchor="start" >Natural-language intent is converted into ranked, validated candidates with full provenance.</text>
<rect x="160" y="340" width="420" height="116" rx="58" fill="#EAF2FC" stroke="none" stroke-width="0" /><text x="198" y="388" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#64748B" text-anchor="start" >WORKFLOW</text><text x="198" y="433" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#3977D3" text-anchor="start" >23 agent nodes</text><rect x="610" y="340" width="420" height="116" rx="58" fill="#E7F6F3" stroke="none" stroke-width="0" /><text x="648" y="388" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#64748B" text-anchor="start" >TOOLBOX</text><text x="648" y="433" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#1F9D8A" text-anchor="start" >73 methods</text><rect x="1060" y="340" width="420" height="116" rx="58" fill="#F0EDFC" stroke="none" stroke-width="0" /><text x="1098" y="388" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#64748B" text-anchor="start" >DATA</text><text x="1098" y="433" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#7564D8" text-anchor="start" >485,329 seeds</text><rect x="1510" y="340" width="420" height="116" rx="58" fill="#FCEDEA" stroke="none" stroke-width="0" /><text x="1548" y="388" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#64748B" text-anchor="start" >SCHEMAS</text><text x="1548" y="433" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#E97968" text-anchor="start" >19 models</text><rect x="1960" y="340" width="420" height="116" rx="58" fill="#FFF4DC" stroke="none" stroke-width="0" /><text x="1998" y="388" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#64748B" text-anchor="start" >EXTERNAL DATA</text><text x="1998" y="433" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#E9A63A" text-anchor="start" >6 live APIs</text><rect x="2410" y="340" width="420" height="116" rx="58" fill="#EEF3F7" stroke="none" stroke-width="0" /><text x="2448" y="388" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#64748B" text-anchor="start" >CODEBASE</text><text x="2448" y="433" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#10243E" text-anchor="start" >~18,697 lines</text><rect x="160" y="535" width="600" height="880" rx="42" fill="#FFFFFF" stroke="#D9E4EF" stroke-width="3" filter="url(#shadow)"/><circle cx="220" cy="618" r="13" fill="#3977D3" stroke="none" stroke-width="0"/><text x="250" y="630" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#10243E" text-anchor="start" >1  Define the design problem</text><text x="220" y="710" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="600" fill="#21354D" text-anchor="start" >Target protein</text><text x="220" y="771.05" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="600" fill="#21354D" text-anchor="start" >Warhead preference</text><text x="220" y="832.1" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="600" fill="#21354D" text-anchor="start" >E3 ligase preference</text><text x="220" y="893.15" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="600" fill="#21354D" text-anchor="start" >Linker constraints</text><text x="220" y="954.2" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="600" fill="#21354D" text-anchor="start" >Safety requirements</text><rect x="220" y="1195" width="480" height="190" rx="30" fill="#EAF2FC" stroke="none" stroke-width="0" /><text x="260" y="1260" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#3977D3" text-anchor="start" >Example request</text><text x="260" y="1310" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" fill="#21354D" text-anchor="start" >“Design an HMGB2 PROTAC</text><text x="260" y="1348.75" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="600" fill="#21354D" text-anchor="start" >using ICM and CRBN.”</text><rect x="920" y="535" width="1360" height="880" rx="42" fill="#FFFFFF" stroke="#D9E4EF" stroke-width="3" filter="url(#shadow)"/><circle cx="980" cy="618" r="13" fill="#7564D8" stroke="none" stroke-width="0"/><text x="1010" y="630" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#10243E" text-anchor="start" >2  Orchestrate evidence-driven design</text><rect x="990" y="705" width="1180" height="82" rx="22" fill="#EAF2FC" stroke="none" stroke-width="0" /><circle cx="1032" cy="746" r="15" fill="#3977D3" stroke="none" stroke-width="0"/><text x="1070" y="757" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" fill="#10243E" text-anchor="start" >Intent &amp; safety</text><text x="1485" y="757" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#64748B" text-anchor="start" >parse • plan • precheck</text><rect x="990" y="810" width="1180" height="82" rx="22" fill="#E7F6F3" stroke="none" stroke-width="0" /><circle cx="1032" cy="851" r="15" fill="#1F9D8A" stroke="none" stroke-width="0"/><text x="1070" y="862" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" fill="#10243E" text-anchor="start" >Target &amp; binders</text><text x="1485" y="862" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#64748B" text-anchor="start" >resolve • retrieve • select</text><rect x="990" y="915" width="1180" height="82" rx="22" fill="#F0EDFC" stroke="none" stroke-width="0" /><circle cx="1032" cy="956" r="15" fill="#7564D8" stroke="none" stroke-width="0"/><text x="1070" y="967" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" fill="#10243E" text-anchor="start" >Molecular design</text><text x="1485" y="967" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#64748B" text-anchor="start" >exit vector • linker • construct</text><rect x="990" y="1020" width="1180" height="82" rx="22" fill="#FCEDEA" stroke="none" stroke-width="0" /><circle cx="1032" cy="1061" r="15" fill="#E97968" stroke="none" stroke-width="0"/><text x="1070" y="1072" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" fill="#10243E" text-anchor="start" >Prediction</text><text x="1485" y="1072" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#64748B" text-anchor="start" >validity • degradation • ADMET • novelty</text><rect x="990" y="1125" width="1180" height="82" rx="22" fill="#FFF4DC" stroke="none" stroke-width="0" /><circle cx="1032" cy="1166" r="15" fill="#E9A63A" stroke="none" stroke-width="0"/><text x="1070" y="1177" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" fill="#10243E" text-anchor="start" >Decision</text><text x="1485" y="1177" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#64748B" text-anchor="start" >rank • diversify • reflect • evolve</text><rect x="990" y="1230" width="1180" height="82" rx="22" fill="#EAF7EE" stroke="none" stroke-width="0" /><circle cx="1032" cy="1271" r="15" fill="#41A66A" stroke="none" stroke-width="0"/><text x="1070" y="1282" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" fill="#10243E" text-anchor="start" >Structural evidence</text><text x="1485" y="1282" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#64748B" text-anchor="start" >ternary feasibility • final rank</text><rect x="2440" y="535" width="600" height="880" rx="42" fill="#FFFFFF" stroke="#D9E4EF" stroke-width="3" filter="url(#shadow)"/><circle cx="2500" cy="618" r="13" fill="#E97968" stroke="none" stroke-width="0"/><text x="2530" y="630" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#10243E" text-anchor="start" >3  Deliver decision-ready output</text><text x="2500" y="710" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="600" fill="#21354D" text-anchor="start" >Ranked PROTAC candidates</text><text x="2500" y="767.35" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="600" fill="#21354D" text-anchor="start" >Validation and risk flags</text><text x="2500" y="824.7" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="600" fill="#21354D" text-anchor="start" >Ternary feasibility evidence</text><text x="2500" y="882.05" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="600" fill="#21354D" text-anchor="start" >Diversity-aware selection</text><text x="2500" y="939.4" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="600" fill="#21354D" text-anchor="start" >Traceable agent decisions</text><text x="2500" y="996.75" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="600" fill="#21354D" text-anchor="start" >Markdown • CSV • JSON</text><rect x="2500" y="1270" width="480" height="120" rx="60" fill="url(#gradBlue)" stroke="none" stroke-width="0" /><text x="2740" y="1345" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" fill="#fff" text-anchor="middle" >Ranked candidates</text><line x1="790" y1="975" x2="885" y2="975" stroke="#3977D3" stroke-width="10" stroke-linecap="round" /><polygon points="885,975 861,960 861,990" fill="#3977D3"/><line x1="2305" y1="975" x2="2400" y2="975" stroke="#E97968" stroke-width="10" stroke-linecap="round" /><polygon points="2400,975 2376,960 2376,990" fill="#E97968"/><line x1="160" y1="1712" x2="3040" y2="1712" stroke="#D9E4EF" stroke-width="3" stroke-linecap="round" /><text x="160" y="1760" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#64748B" text-anchor="start" >PROTACXtend architecture</text><text x="3040" y="1760" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#64748B" text-anchor="end" >01</text></svg>