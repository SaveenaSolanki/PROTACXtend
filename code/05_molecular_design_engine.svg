xt x="2256" y="1454" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#64748B" text-anchor="start" >P4ward: 3,600 poses + minimization</text><line x1="160" y1="1712" x2="3040" y2="1712" stroke="#D9E4EF" stroke-width="3" stroke-linecap="round" /><text x="160" y="1760" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#64748B" text-anchor="start" >PROTACXtend architecture</text><text x="3040" y="1760" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#64748B" text-anchor="end" >05</text></svg>