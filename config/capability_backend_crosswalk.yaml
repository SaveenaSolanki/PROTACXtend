schema_version: 1.0.0
generated_by: sota/closure/generate_capability_crosswalk.py
taxonomy:
  capability: 27 TPD/escalation capabilities (protacxtend/escalation/capabilities.py)
  backend: 19 capability-first scientific backends (protacxtend/scientific_backends/registry.py)
  implementation: local tool / model / external engine
fallback_classes:
  EXACT: equivalent engine; may auto-substitute
  APPROXIMATE: scientifically accepted approximation; may auto-substitute, must be labelled
  SURROGATE: proxy only; must be explicitly labelled, never silent
  INFORMATIONAL_ONLY: cannot satisfy a computational capability
  INVALID: must not be used; recorded for audit
summary:
  total_capabilities: 27
  by_readiness:
    READY: 10
    BLOCKED: 11
    EXECUTABLE: 6
  backend_map:
    smiles_validation: chemistry
    cheminformatics: chemistry
    conformer_generation: conformer_generation
    structure_preparation: protein_preparation
    ligand_docking: ligand_docking
    protein_protein_docking: ppi_docking
    ternary_complex_modeling: ternary_docking
    binding_energy: binding_energy
    molecular_dynamics: molecular_dynamics
    admet_toxicity: admet
  blocked:
    ligand_preparation: no validated local ligand-prep backend; Meeko/MGLTools are wrappers around primitives
      that are not contract-tested here
    linker_generation: generative linker engines are repo+weights tools (DeLinker/DiffLinker/LinkInvent);
      none provisioned and no contract test exists
    de_novo_generation: no provisioned generative model with validated 3D-aware chemistry
    reaction_prediction: no provisioned atom-mapping / reaction model
    protein_language_models: ESM-2/ProtT5 weights not provisioned in this environment
    patent_mining: web-only (SureChEMBL/Lens); no local implementation and no licence
    proteomics: FragPipe/MaxQuant not installed; no MS data pipeline
    image_analysis: CellProfiler not installed; no imaging pipeline
    molecular_visualization: visualisation is not a computational capability; INFORMATIONAL_ONLY only
    quantum_chemistry: xTB/MOPAC/ORCA not installed; no QM engine
    workflow_platforms: KNIME/Galaxy are external orchestrators, not scientific backends
  suspicious_mappings_audited:
    literature_mining: &id003
      verdict: INFORMATIONAL_ONLY
      finding: target_binder lookup and literature retrieval route here; text-mined binders are NOT a
        structural binder retrieval
      required_fix: route target_binder lookup through a binder database (ChEMBL/BindingDB) with identifier
        validation, not free text mining
    cheminformatics: &id001
      verdict: INVALID_AS_CATCHALL
      finding: detect_exit_vectors, predict_cooperativity and rank_candidates currently fall back to generic
        cheminformatics
      required_fix: detect_exit_vectors -> structure/geometry backend; predict_cooperativity -> ternary/mechanistic
        backend; rank_candidates -> candidate_ranking backend
    degradation_prediction: &id002
      verdict: FIXED_P0
      finding: Chemprop secondary path raised pybind11 TypeError on non-string SMILES; fallback provenance
        was silently reset to False
      required_fix: implemented in Phase A (sota/runtime_closure/P0_DEGRADATION_FIX.md); regression/provenance/replay
        tests added
