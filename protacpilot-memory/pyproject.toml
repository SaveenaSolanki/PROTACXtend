[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protacpilot-memory"
version = "0.1.0"
description = "PROTACpilot Cognitive Memory: neuroscience-inspired scientific memory for autonomous PROTAC design."
readme = "README.md"
requires-python = ">=3.10"
# Runtime is intentionally stdlib-only. Embeddings / HTTP clients are optional.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
embeddings = ["numpy>=1.24"]

[project.scripts]
ppmemory = "protacpilot_memory.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["protacpilot_memory*"]

[tool.setuptools.package-data]
protacpilot_memory = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
